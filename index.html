<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>圣冠 / Holy Crown</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#d4af6a;--gold2:#f0d79a;--line:#3a2f22;--txt:#c9b896}
body{background:radial-gradient(ellipse at 50% -10%,#2a1f14 0%,#0c0a08 60%,#050403 100%);color:var(--txt);font-family:"Noto Serif SC","Songti SC","SimSun",serif;min-height:100vh;padding:10px;font-size:14px;line-height:1.6}
#root{max-width:960px;margin:0 auto}
h1,h2,h3{color:var(--gold2);font-weight:600;letter-spacing:1px}
button{font-family:inherit;cursor:pointer;border:1px solid var(--line);background:linear-gradient(180deg,#241c14,#15100c);color:var(--gold2);padding:8px 14px;border-radius:3px;font-size:13px;transition:.15s}
button:hover:not(:disabled){background:linear-gradient(180deg,#332618,#1d1610);border-color:var(--gold)}
button:disabled{opacity:.35;cursor:not-allowed}
input{font-family:inherit;background:#0f0c09;border:1px solid var(--line);color:var(--gold2);padding:9px 12px;border-radius:3px;font-size:14px;width:100%}
input:focus{outline:none;border-color:var(--gold)}
.card{background:linear-gradient(180deg,rgba(30,24,17,.95),rgba(14,11,8,.95));border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:10px;position:relative}
.title-screen{text-align:center;padding:60px 20px}
.title-screen h1{font-size:44px;letter-spacing:10px;margin-bottom:6px;background:linear-gradient(180deg,#f7e6b8,#a8842f);-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{color:#6b5b45;letter-spacing:5px;font-size:12px;margin-bottom:36px}
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:linear-gradient(180deg,#1d1710,#0e0b08);border:1px solid var(--line);border-radius:4px;padding:10px 14px;margin-bottom:10px}
.pname{color:var(--gold2);font-size:16px}
.tag{font-size:11px;padding:2px 8px;border:1px solid var(--line);border-radius:10px;color:#8a7a60;background:#0f0c09}
.tag.on{border-color:#4a7c59;color:#7fd4a0}
.tag.off{border-color:#5a3a3a;color:#c98080}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tabs button{flex:1;min-width:60px;padding:8px 6px;font-size:12px}
.tabs button.active{background:linear-gradient(180deg,#3d2e19,#221a10);border-color:var(--gold);color:#fff2cc}
.bar{height:16px;background:#0a0806;border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative;margin:4px 0}
.bar>div{height:100%;transition:width .3s}
.bar span{position:absolute;inset:0;text-align:center;font-size:11px;line-height:16px;color:#fff;text-shadow:0 0 4px #000}
.hpfill{background:linear-gradient(90deg,#7a1f1f,#c0392b)}
.mpfill{background:linear-gradient(90deg,#1f3a7a,#3b6fd4)}
.expfill{background:linear-gradient(90deg,#6b5a1f,#d4af6a)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cls-card{border:1px solid var(--line);border-radius:4px;padding:10px;cursor:pointer;background:linear-gradient(180deg,#191410,#0e0b08);transition:.15s;text-align:center}
.cls-card:hover{border-color:var(--gold)}
.cls-card.sel{border-color:var(--gold);background:linear-gradient(180deg,#332618,#1a130c)}
.cls-card .ic{font-size:26px;display:block;margin-bottom:4px}
.cls-card .nm{color:var(--gold2);font-size:14px}
.cls-card .ds{font-size:11px;color:#7a6a52;margin-top:4px}
.row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px dashed rgba(58,47,34,.6);font-size:13px}
.row:last-child{border-bottom:none}
.row .k{color:#8a7a60}
.row .v{color:var(--gold2);font-weight:600}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:3px;background:#100d0a;margin-bottom:6px;font-size:13px}
.item .iname{flex:1;min-width:0}
.log{max-height:220px;overflow-y:auto;font-size:13px;line-height:1.7}
.log div{padding:1px 0;border-bottom:1px solid rgba(58,47,34,.3)}
.log .dmg{color:#e88a7a}
.log .heal{color:#8ed49a}
.log .crit{color:#ffd700;font-weight:bold}
.log .sys{color:#6b5b45;font-style:italic}
.log .win{color:#7fd4a0;font-weight:bold}
.log .lose{color:#c0392b;font-weight:bold}
.log .skill{color:#a855f7;font-weight:bold}
.enemy-box{text-align:center;padding:18px;border:1px solid var(--line);border-radius:4px;background:radial-gradient(circle at 50% 40%,#241a12,#0b0907);margin-bottom:10px}
.enemy-ic{font-size:48px;display:block;margin-bottom:6px}
.enemy-name{color:#e8c88a;font-size:17px;letter-spacing:2px}
.skill-btn{width:100%;text-align:left;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.skill-btn small{color:#7a6a52;font-size:11px;font-weight:normal}
.potion-btn{padding:8px 10px;font-size:12px;margin:2px}
.status-bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.status-tag{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:bold}
.status-bleed{background:#4a1f1f;color:#e88a7a;border:1px solid #c0392b}
.status-burn{background:#4a3018;color:#f0b060;border:1px solid #f97316}
.status-freeze{background:#1a3050;color:#7fd4e8;border:1px solid #3b6fd4}
.status-stun{background:#3a1a4a;color:#c88ae8;border:1px solid #a855f7}
.notif{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#241c14;border:1px solid var(--gold);color:var(--gold2);padding:8px 20px;border-radius:3px;z-index:99;font-size:13px}
.rar0{color:#8a8a8a}.rar1{color:#b87333}.rar2{color:#c8c8c8}.rar3{color:#ffd700}.rar4{color:#a855f7}.rar5{color:#22d3ee}.rar6{color:#f97316}.rar7{color:#ef4444}.rar8{color:#fde047}
.small{font-size:11px;color:#6b5b45}
.center{text-align:center}
.flex{display:flex;gap:8px;flex-wrap:wrap}
.flex>*{flex:1;min-width:120px}
.hl{color:var(--gold2)}
.danger{color:#e88a7a}
.ok{color:#7fd4a0}
.chat-box{max-height:240px;overflow-y:auto;border:1px solid var(--line);border-radius:3px;padding:8px;margin-bottom:8px;background:#0a0806}
.chat-msg{margin-bottom:6px}
.chat-msg.me{text-align:right}
.chat-bubble{display:inline-block;max-width:80%;padding:6px 10px;border-radius:6px;font-size:12px}
.chat-msg.me .chat-bubble{background:#3d2e19;color:var(--gold2)}
.chat-msg.other .chat-bubble{background:#1a1a1a;color:#b0a080}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:linear-gradient(180deg,#241c14,#0e0b08);border:1px solid var(--gold);border-radius:6px;width:100%;max-width:360px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.9)}
</style>
</head>

function save(){
  try{ localStorage.setItem('holycrown_save',JSON.stringify(S)); }catch(e){}
  // 如果是正式账号，同步到云端
  if(window.MY_UID && !window.MY_IS_ANON && window.FB){
    FB.set(FB.ref(FB.db, 'saves/' + MY_UID), S).catch(e => console.warn("云存档失败", e));
  }
}

function load(){
  try{
    const d=localStorage.getItem('holycrown_save');
    if(d){ S=JSON.parse(d); fixSaveData(); return true; }
  }catch(e){}
  return false;
}

async function loadCloudSave(){
  if(!window.MY_UID || window.MY_IS_ANON || !window.FB) return false;
  try {
    const snap = await FB.get(FB.ref(FB.db, 'saves/' + MY_UID));
    if(snap.exists()){
      S = snap.val();
      fixSaveData();
      localStorage.setItem('holycrown_save', JSON.stringify(S));
      return true;
    }
  } catch(e) { console.warn("拉取云存档失败", e); }
  return false;
}

function fixSaveData(){
  if(!S)return;
  if(!S.skillbooks)S.skillbooks=[];
  if(!S.potions)S.potions={hp:0,hpBig:0,mp:0,ultimate:0};
  if(!S.shards)S.shards=0;
  if(!S.titles)S.titles=[];
  if(!S.inv)S.inv=[];
  if(!S.weaponStock)S.weaponStock=[];
  if(!S.equip)S.equip={weapon:null,helmet:null,armor:null,boots:null,bracer:null,bracelet:null,ring:null,necklace:null};
  if(S.adv===undefined)S.adv=null;
  if(S.sub===undefined)S.sub=null;
  if(S.crown===undefined)S.crown=null;
  if(S.guild && typeof S.guild === 'string') { S.guild = null; S.guildId = null; }
  if(!S.guildId) S.guildId = null;
  if(!S.mode)S.mode='online';
}

async function doAuth(mode){
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPass').value.trim();
  if(!email || !pass) { notify('请填写邮箱和密码'); return; }
  if(pass.length < 6) { notify('密码至少6位'); return; }

  try {
    if(mode === 'login') {
      await window.AUTH_API.signInWithEmailAndPassword(window.FB.auth, email, pass);
      notify('登录成功，正在同步云存档...');
    } else {
      const userCred = await window.AUTH_API.createUserWithEmailAndPassword(window.FB.auth, email, pass);
      // 注册成功，如果当前有本地存档，上传到新账号
      if(S) {
        await FB.set(FB.ref(FB.db, 'saves/' + userCred.user.uid), S);
      }
      notify('注册成功！');
    }
    UI.showAuthModal = false;
    // onAuthStateChanged 会自动触发，这里只需重新渲染
    render();
  } catch(e) {
    console.error(e);
    if(e.code === 'auth/email-already-in-use') notify('该邮箱已被注册');
    else if(e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found' || e.code === 'auth/invalid-credential') notify('邮箱或密码错误');
    else notify('操作失败: ' + e.message);
  }
}

function logout(){
  if(!confirm('确定要退出账号吗？请确保你已经记住了账号密码。')) return;
  window.AUTH_API.signOut(window.FB.auth).then(() => {
    notify('已退出，转为匿名游客');
    S = null; B = null; UI.creating = true; UI.classSel = null;
    try{ localStorage.removeItem('holycrown_save'); }catch(e){}
    render();
  });
}

};

// ================= 其它游戏逻辑（保持原样） =================
function playerStats(){
  const c=CLASSES[S.cls],L=S.level;
  let st={hp:c.hp+c.hpG*(L-1),mp:c.mp+c.mpG*(L-1),atk:c.atk+c.atkG*(L-1),def:c.def+c.defG*(L-1),spd:c.spd+c.spdG*(L-1),crit:c.crit};
  const o=ORIGINS[S.origin].bonus;
  if(o.hpMul)st.hp*=o.hpMul;if(o.atkMul)st.atk*=o.atkMul;if(o.defMul)st.def*=o.defMul;if(o.critMul)st.crit*=o.critMul;
  if(S.adv){const a=CLASSES[S.cls].adv.find(x=>x.n===S.adv);if(a){if(a.hpMul)st.hp*=a.hpMul;if(a.mpMul)st.mp*=a.mpMul;if(a.atkMul)st.atk*=a.atkMul;if(a.defMul)st.def*=a.defMul;if(a.spdMul)st.spd*=a.spdMul;if(a.critMul)st.crit*=a.critMul;}}
  for(const k in S.equip){const e=S.equip[k];if(!e)continue;for(const s of STAT_KEYS)if(e[s])st[s]+=e[s];}
  if(S.crown){const cr=CROWNS.find(x=>x.name===S.crown.name);if(cr)for(const s in cr.b)st[s]=(st[s]||0)*(1+cr.b[s]/100);}
  for(const t of S.titles){const td=TITLES.find(x=>x.name===t);if(td&&td.b)for(const s in td.b)st[s]=(st[s]||0)+td.b[s];}
  if(social.myGuildData){
    const lvl = social.myGuildData.level || 1;
    st.hp *= (1 + lvl * 0.03); st.atk *= (1 + lvl * 0.03); st.def *= (1 + lvl * 0.03); st.spd *= (1 + lvl * 0.03);
  }
  for(const s in st)st[s]=Math.round(st[s]);
  return st;
}

function calcPower(){
  const p=playerStats();
  return p.atk*10+p.hp+p.def*5+p.spd*5+Math.round(p.crit*20);
}

function expNeed(lv){return Math.floor(50*Math.pow(lv,1.4));}
function syncVitals(){const p=playerStats();S.hp=clamp(S.hp,0,p.hp);S.mp=clamp(S.mp,0,p.mp);}

function genEquip(slot,ilvl,rarIdx,classReq){
  const rar=rarIdx!==undefined?rarIdx:Math.min(8,Math.floor(Math.random()*Math.random()*9));
  const mul=RAR[rar].m,statDef=SLOT_STATS[slot];
  const item={id:'it'+Date.now()+Math.random(),slot,rar,lvl:Math.max(1,Math.round(ilvl)),name:''};
  for(const s in statDef){let base=(3+ilvl*1.15)*statDef[s]*mul*rf(0.85,1.15);if(s==='crit')base*=0.35;item[s]=Math.max(1,Math.round(base));}
  const prefix=['','青铜','白银','黄金','史诗','遗迹','传说','神话','三日月'][rar];
  const baseName=pick(BASE_NAMES[slot]);
  const suffix=['','·之刃','·的守望','·裁决','·序曲','·残响','·终焉','·圣痕','·神谕'][rar];
  item.name=(prefix?prefix+'·':'')+baseName+suffix;
  if(slot==='weapon')item.reqClass=classReq||null;
  return item;
}

function canEquip(it){if(!it||!it.reqClass)return true;const reqs=Array.isArray(it.reqClass)?it.reqClass:[it.reqClass];if(reqs.includes(S.cls))return true;if(S.sub&&reqs.includes(S.sub))return true;return false;}
function reqLabel(it){if(!it.reqClass)return '通用';const reqs=Array.isArray(it.reqClass)?it.reqClass:[it.reqClass];return reqs.map(k=>CLASSES[k]?CLASSES[k].name:k).join('/');}
function randomWeaponReq(){return Math.random()<0.4?null:pick(CLASS_KEYS);}

function genShopWeapon(){
  const lv=clamp(S.level+rnd(-3,5),1,160);const r=Math.random();let rar;
  if(r<0.35)rar=rnd(0,2);else if(r<0.65)rar=rnd(2,4);else if(r<0.88)rar=rnd(4,6);else rar=rnd(6,8);
  const it=genEquip('weapon',lv,rar,randomWeaponReq());
  it.shopPrice=Math.round((40+lv*18)*RAR[rar].m*rf(0.9,1.2));
  return it;
}
function refreshWeaponStock(){S.weaponStock=[];const n=rnd(4,5);for(let i=0;i<n;i++)S.weaponStock.push(genShopWeapon());}
function ensureWeaponStock(){if(!S.weaponStock)S.weaponStock=[];if(S.weaponStock.length===0)refreshWeaponStock();}

function equipItem(idx){const it=S.inv[idx];if(!it)return;if(it.slot==='weapon'&&!canEquip(it)){notify('职业不符，无法装备');return;}const old=S.equip[it.slot];S.equip[it.slot]=it;S.inv.splice(idx,1);if(old)S.inv.push(old);syncVitals();save();render();if(window.syncMyProfile)syncMyProfile();notify('已装备 '+it.name);}
function sellItem(idx){const it=S.inv[idx];if(!it)return;const price=Math.round((10+it.lvl*8)*RAR[it.rar].m);S.gold+=price;S.inv.splice(idx,1);save();render();notify('出售获得 '+fmt(price)+' CC');}

function statLine(it){return STAT_KEYS.filter(k=>it[k]).map(k=>STAT_LABELS[k]+'+'+it[k]).join('　');}
function statCompare(it){const cur=S.equip[it.slot];return STAT_KEYS.map(k=>{const nv=it[k]||0,ov=cur?(cur[k]||0):0,diff=nv-ov;if(nv===0&&(!cur||ov===0))return '';let s='<span style="display:inline-block;margin-right:12px;white-space:nowrap">'+STAT_LABELS[k]+' '+(nv>0?'+'+nv:'0');if(cur&&diff!==0){if(diff>0)s+=' <span style="color:#7fd4a0;font-weight:bold">▲+'+diff+'</span>';else s+=' <span style="color:#e88a7a;font-weight:bold">▼'+Math.abs(diff)+'</span>';}s+='</span>';return s;}).join('');}
function equipScore(it){return (it.hp||0)*0.5+(it.mp||0)*0.3+(it.atk||0)*2+(it.def||0)*1.5+(it.spd||0)*1.5+(it.crit||0)*3;}

function makeEnemy(name,lv,isBoss){
  const bmHp=isBoss?1.8:1,bmAtk=isBoss?2.4:1,bmDef=isBoss?1.15:1;
  const e={name,lv,maxHp:Math.round((40+lv*20+lv*lv*0.55)*bmHp*rf(0.92,1.08)),atk:Math.round((5+lv*2.2)*bmAtk*rf(0.92,1.08)),def:Math.round((3+lv*1.5)*bmDef*rf(0.9,1.1)),spd:Math.round((6+lv*1.2)*rf(0.9,1.1)),isBoss};
  e.hp=e.maxHp;return e;
}
function enemyExp(e){return Math.round((10+e.lv*10+e.lv*e.lv*0.5)*(e.isBoss?2.5:1));}
function enemyGold(e){return Math.round((8+e.lv*5+e.lv*e.lv*0.2)*(e.isBoss?3:1));}

function getSkills(){
  const list=[...CLASSES[S.cls].skills];
  if(S.adv){const a=CLASSES[S.cls].adv.find(x=>x.n===S.adv);if(a&&a.skill)list.push(a.skill);}
  if(S.sub){const sub=CLASSES[S.sub];if(sub)list.push({...sub.skills[0],n:'[副]'+sub.skills[0].n});}
  if(S.skillbooks&&SKILLBOOKS[S.cls]){for(const b of SKILLBOOKS[S.cls]){if(S.skillbooks.includes(b.id))list.push({...b,n:'[书]'+b.n});}}
  return list;
}

function startBattle(enemy,opts){
  opts=opts||{};
  B={enemy,log:[],over:false,busy:false,turn:0,defBuff:0,defBuffTurns:0,eDefDown:0,dungeon:opts.dungeon||null,isDungeon:!!opts.dungeon,reward:{exp:0,gold:0,items:[],shards:0},status:{bleed:0,burn:0,freeze:0,stun:0},bossTurn:0};
  B.log.push({t:'sys',m:'⚔ 遭遇 '+enemy.name+'（Lv.'+enemy.lv+'）'+(enemy.isBoss?' 👑BOSS':'')});
  render();
}

function calcDmg(atk,def,mul,critRate,opts){
  opts=opts||{};
  const defFactor=opts.defFactor!==undefined?opts.defFactor:0.3;
  const spread=opts.spread!==undefined?opts.spread:0.08;
  const minMul=opts.minMul!==undefined?opts.minMul:0.15;
  let base=atk*mul-def*defFactor;base=Math.max(base,atk*minMul);
  const isCrit=Math.random()*100<(critRate||0);
  let dmg=base*rf(1-spread,1+spread)*(isCrit?1.85:1);
  return {dmg:Math.max(1,Math.round(dmg)),crit:isCrit};
}

function applyBuff(sk){
  if(sk.n.includes('铁壁')){B.defBuff=0.6;B.defBuffTurns=3;}
  else if(sk.n.includes('坚守')){B.defBuff=1;B.defBuffTurns=3;}
  else if(sk.n.includes('不动')||sk.n.includes('不灭')){B.defBuff=1.5;B.defBuffTurns=3;}
  else if(sk.n.includes('圣盾')||sk.n.includes('圣枪')||sk.n.includes('神恩')){B.defBuff=1.2;B.defBuffTurns=3;}
  else if(sk.n.includes('改造')){B.atkBuff=1;B.atkBuffTurns=3;}
  else if(sk.n.includes('钢铁')){B.defBuff=1;B.defBuffTurns=2;}
  else if(sk.n.includes('鹰眼')||sk.n.includes('心眼')||sk.n.includes('隐身')){B.critBuff=1;B.critBuffTurns=2;}
  else {B.defBuff=0.8;B.defBuffTurns=2;}
}

async function useSkill(idx){
  if(!B||B.over||B.busy)return;
  B.busy=true;const p=playerStats();const skills=getSkills();const sk=skills[idx];
  if(!sk){B.busy=false;return;}
  if(sk.mp>S.mp){notify('斗气不足！');B.busy=false;return;}
  S.mp-=sk.mp;const e=B.enemy;
  if(sk.t==='buff'){applyBuff(sk);B.log.push({t:'sys',m:'你使用了「'+sk.n+'」，状态提升！'});render();await sleep(420);}
  else if(sk.t==='heal'){const heal=Math.round(p.atk*sk.mul+rf(0.9,1.1)*p.hp*0.05);S.hp=Math.min(p.hp,S.hp+heal);B.log.push({t:'heal',m:'✨ '+sk.n+' 恢复了 '+fmt(heal)+' 点生命'});render();await sleep(420);}
  else if(sk.t==='mana'){const mana=Math.round(p.mp*sk.mul);S.mp=Math.min(p.mp,S.mp+mana);B.log.push({t:'heal',m:'💠 '+sk.n+' 恢复了 '+fmt(mana)+' 点斗气'});render();await sleep(420);}
  else {
    const hits=sk.hits||1;let total=0,anyCrit=false;const critRate=p.crit+(B.critBuff?100:0);
    for(let i=0;i<hits;i++){const r=calcDmg(p.atk*(1+(B.atkBuff||0)),e.def*(1-B.eDefDown),sk.mul,critRate);total+=r.dmg;anyCrit=anyCrit||r.crit;await sleep(120);}
    e.hp-=total;if(sk.n.includes('腐蚀'))B.eDefDown=Math.min(0.5,B.eDefDown+0.25);
    B.log.push({t:anyCrit?'crit':'dmg',m:(anyCrit?'💥 暴击！':'')+sk.n+' 对 '+e.name+' 造成 '+fmt(total)+' 点伤害'+(hits>1?'（'+hits+'段）':'')});
    render();await sleep(420);
  }
  if(e.hp<=0){await winBattle();return;}
  await sleep(260);B.turn++;
  if(B.defBuffTurns>0){B.defBuffTurns--;if(B.defBuffTurns===0)B.defBuff=0;}
  if(B.atkBuffTurns>0){B.atkBuffTurns--;if(B.atkBuffTurns===0)B.atkBuff=0;}
  if(B.critBuffTurns>0){B.critBuffTurns--;if(B.critBuffTurns===0)B.critBuff=0;}
  await enemyTurn();
}

async function enemyTurn(){
  if(!B||B.over)return;
  const e=B.enemy;const p=playerStats();const pDef=p.def*(1+B.defBuff);
  B.bossTurn++;const useBossSkill=e.isBoss&&B.bossTurn%3===0;
  if(useBossSkill){
    const sk=pick(BOSS_SKILLS);const eOpts={defFactor:0.05,spread:0.20,minMul:0.35};const er=calcDmg(e.atk,0,sk.mul,10,eOpts);S.hp-=er.dmg;
    B.log.push({t:'skill',m:'👑 '+e.name+' 释放「'+sk.n+'」！造成 '+fmt(er.dmg)+' 点伤害'});
    if(sk.effect==='bleed'){B.status.bleed=sk.turns;B.log.push({t:'sys',m:'🩸 你陷入了流血状态（'+sk.turns+'回合）'});}
    if(sk.effect==='burn'){B.status.burn=sk.turns;B.log.push({t:'sys',m:'🔥 你陷入了灼烧状态（'+sk.turns+'回合）'});}
    if(sk.effect==='freeze'){B.status.freeze=sk.turns;B.log.push({t:'sys',m:'❄️ 你被冰冻了（'+sk.turns+'回合）'});}
    if(sk.effect==='stun'){B.status.stun=sk.turns;B.log.push({t:'sys',m:'💫 你被眩晕了（'+sk.turns+'回合）'});}
    if(sk.effect==='drain'){const drain=Math.round(er.dmg*0.5);B.enemy.hp=Math.min(B.enemy.maxHp,B.enemy.hp+drain);B.log.push({t:'sys',m:'💉 '+e.name+' 恢复了 '+drain+' 点生命'});}
    render();await sleep(600);
  } else {
    const eOpts=e.isBoss?{defFactor:0.05,spread:0.20,minMul:0.35}:undefined;
    const er=calcDmg(e.atk,pDef,1,e.isBoss?10:5,eOpts);S.hp-=er.dmg;
    B.log.push({t:'dmg',m:e.name+' 发起攻击，造成 '+fmt(er.dmg)+' 点伤害'+(er.crit?'（暴击）':'')});render();await sleep(400);
  }
  if(S.hp<=0){await loseBattle();return;}
  if(B.status.bleed>0){const dmg=Math.round(e.atk*0.3);S.hp-=dmg;B.status.bleed--;B.log.push({t:'dmg',m:'🩸 流血造成 '+dmg+' 点伤害（剩余'+B.status.bleed+'回合）'});if(S.hp<=0){await loseBattle();return;}}
  if(B.status.burn>0){const dmg=Math.round(e.atk*0.4);S.hp-=dmg;B.status.burn--;B.log.push({t:'dmg',m:'🔥 灼烧造成 '+dmg+' 点伤害（剩余'+B.status.burn+'回合）'});if(S.hp<=0){await loseBattle();return;}}
  if(B.status.freeze>0){B.log.push({t:'sys',m:'❄️ 冰冻中（剩余'+B.status.freeze+'回合）'});B.status.freeze--;}
  if(B.status.stun>0){B.log.push({t:'sys',m:'💫 眩晕中（剩余'+B.status.stun+'回合）'});B.status.stun--;}
  B.busy=false;save();render();
}

function usePotion(type){
  if(!B||B.over||B.busy)return;
  if(!S.potions)S.potions={hp:0,hpBig:0,mp:0,ultimate:0};
  const qty=S.potions[type]||0;if(qty<=0){notify('药水不足');return;}
  const p=playerStats();S.potions[type]--;
  if(type==='hp'){const heal=Math.round(p.hp*0.3);S.hp=Math.min(p.hp,S.hp+heal);B.log.push({t:'heal',m:'🩸 使用生命药水，恢复 '+heal+' 生命'});}
  else if(type==='hpBig'){const heal=Math.round(p.hp*0.6);S.hp=Math.min(p.hp,S.hp+heal);B.log.push({t:'heal',m:'💗 使用高级生命药水，恢复 '+heal+' 生命'});}
  else if(type==='mp'){const heal=Math.round(p.mp*0.5);S.mp=Math.min(p.mp,S.mp+heal);B.log.push({t:'heal',m:'💠 使用斗气药水，恢复 '+heal+' 斗气'});}
  else if(type==='ultimate'){const hh=Math.round(p.hp*0.4),hm=Math.round(p.mp*0.4);S.hp=Math.min(p.hp,S.hp+hh);S.mp=Math.min(p.mp,S.mp+hm);B.log.push({t:'heal',m:'🌟 使用万能药水，恢复 '+hh+' 生命 '+hm+' 斗气'});}
  save();render();
}

async function winBattle(){
  B.over=true;const e=B.enemy,p=playerStats();
  let exp=enemyExp(e);if(S.mode==='single')exp=Math.round(exp*1.2);
  let gold=enemyGold(e);const gm=ORIGINS[S.origin].bonus.goldMul||1;gold=Math.round(gold*gm);
  S.exp+=exp;S.gold+=gold;B.reward.exp=exp;B.reward.gold=gold;
  B.log.push({t:'win',m:'✦ 击败 '+e.name+'！获得 '+fmt(exp)+' 经验、'+fmt(gold)+' CC'});
  const dropCount=e.isBoss?rnd(2,3):(Math.random()<0.45?1:0);
  for(let i=0;i<dropCount;i++){if(S.inv.length>=40){B.log.push({t:'sys',m:'背包已满'});break;}const it=genEquip(pick(SLOTS).id,e.lv,Math.min(8,Math.max(0,Math.floor(e.lv/18)+rnd(0,2))));S.inv.push(it);B.reward.items.push(it);B.log.push({t:'win',m:'📦 获得装备：'+it.name});}
  if(e.isBoss&&Math.random()<0.5){S.shards=(S.shards||0)+1;B.reward.shards=1;B.log.push({t:'win',m:'✧ 获得「圣冠碎片」×1'});}
  S.kills++;checkTitles();levelUpCheck();
  if(S.crown){S.crown.days--;if(S.crown.days<=0){B.log.push({t:'sys',m:'⚠ 「'+S.crown.name+'」已失效'});S.crown=null;}}
  S.day++;B.busy=false;save();render();if(window.syncMyProfile)syncMyProfile();
}

async function loseBattle(){
  B.over=true;B.log.push({t:'lose',m:'✝ 你倒下了…'});S.deaths++;
  let lost=[];if(S.level>1){S.level--;S.exp=Math.floor(expNeed(S.level)*0.3);B.log.push({t:'lose',m:'等级下降至 Lv.'+S.level});}
  const pool=S.inv.slice();for(const k in S.equip)if(S.equip[k])pool.push({__eq:k,it:S.equip[k]});
  const dropN=Math.min(pool.length,rnd(1,2));
  for(let i=0;i<dropN;i++){if(pool.length===0)break;const idx=Math.floor(Math.random()*pool.length);const p=pool.splice(idx,1)[0];if(p.__eq){lost.push(p.it.name);S.equip[p.__eq]=null;}else{lost.push(p.name);const j=S.inv.indexOf(p);if(j>=0)S.inv.splice(j,1);}}
  if(lost.length)B.log.push({t:'lose',m:'💔 遗失了：'+lost.join('、')});
  S.hp=1;S.mp=0;B.busy=false;save();render();if(window.syncMyProfile)syncMyProfile();
}

function levelUpCheck(){
  let leveled=false;while(S.level<160&&S.exp>=expNeed(S.level)){S.exp-=expNeed(S.level);S.level++;leveled=true;}
  if(leveled){const p=playerStats();S.hp=p.hp;S.mp=p.mp;B.log.push({t:'win',m:'▲ 升级！当前等级 Lv.'+S.level});if(S.level>=30&&!S.adv)B.log.push({t:'sys',m:'✦ 你已达到30级，可进行职业进阶！'});if(S.level>=60&&!S.sub)B.log.push({t:'sys',m:'✦ 你已达到60级，可选择副职业！'});if(window.syncMyProfile)syncMyProfile();}
}

function checkTitles(){
  const add=t=>{if(!S.titles.includes(t)){S.titles.push(t);if(B)B.log.push({t:'win',m:'🏆 获得称号：「'+t+'」'});else notify('获得称号：「'+t+'」');}};
  if(S.level>=10)add('初出茅庐');if(S.level>=30)add('边境行者');if(S.level>=60)add('沙场老将');if(S.level>=100)add('传说之人');if(S.level>=150)add('圣域守护者');if(S.kills>=100)add('弑神者');
}

function flee(){
  if(!B||B.over||B.busy)return;
  const p=playerStats();const chance=clamp(0.4+(p.spd-B.enemy.spd)*0.02,0.15,0.9);
  if(Math.random()<chance){B.log.push({t:'sys',m:'你成功脱离了战斗。'});B.over=true;B.busy=false;render();}
  else{B.log.push({t:'sys',m:'逃跑失败！'});B.busy=true;render();setTimeout(()=>{if(!B||B.over)return;const e=B.enemy;const eOpts=e.isBoss?{defFactor:0.05,spread:0.20,minMul:0.35}:undefined;const er=calcDmg(e.atk,p.def,1,e.isBoss?10:5,eOpts);S.hp-=er.dmg;B.log.push({t:'dmg',m:e.name+' 追击，造成 '+fmt(er.dmg)+' 点伤害'});if(S.hp<=0){loseBattle();}else{B.busy=false;render();}},500);}
}

function explore(){
  const reg=REGIONS[UI.region];const roll=Math.random();
  if(roll<0.72){const center=clamp(S.level,reg.min,reg.max);const lv=clamp(center+rnd(-2,3),1,160);startBattle(makeEnemy(pick(reg.enemies),lv,false));}
  else if(roll<0.86){const avgLv=(reg.min+reg.max)/2;const g=Math.round((10+avgLv*7)*rf(0.8,1.4));S.gold+=g;S.day++;save();render();notify('💰 发现 '+fmt(g)+' CC');}
  else if(roll<0.96){if(S.inv.length>=40){notify('背包已满');return;}const avgLv=(reg.min+reg.max)/2;const it=genEquip(pick(SLOTS).id,Math.round(avgLv));S.inv.push(it);S.day++;save();render();notify('📦 拾获 '+it.name);}
  else{S.day++;save();render();notify('风平浪静…');}
}

function enterDungeon(idx){const d=DUNGEONS[idx];if(S.level<Math.max(1,d.lv-5)){notify('等级不足');return;}startBattle(makeEnemy(d.boss,d.lv+rnd(0,2),true),{dungeon:d});}

function bar(cur,max,cls){const pct=max>0?clamp(cur/max*100,0,100):0;return '<div class="bar"><div class="'+cls+'" style="width:'+pct+'%"></div><span>'+fmt(Math.max(0,cur))+' / '+fmt(max)+'</span></div>';}

// ================= Firebase 同步与监听 =================
async function syncMyProfile(){
  if(!socialReady()||!S)return;
  try{
    const profile={ name:S.name, level:S.level, power:calcPower(), cls:S.cls, adv:S.adv||CLASSES[S.cls].name, online:true, updatedAt:FB.serverTimestamp() };
    await FB.set(FB.ref(FB.db,'users/'+MY_UID),profile);
    await FB.set(FB.ref(FB.db,'leaderboard/'+MY_UID),profile);
    social.online=true;
  }catch(e){console.warn('sync profile failed',e);}
}
window.syncMyProfile=syncMyProfile;

function startSocialListeners(){
  if(!socialReady()||social.listenersStarted)return;
  social.listenersStarted=true;

  FB.onValue(FB.ref(FB.db,'friendRequests/'+MY_UID),snap=>{social.requests=[];snap.forEach(c=>social.requests.push({uid:c.key,...c.val()}));if(UI.tab==='social'&&!B)render();});
  FB.onValue(FB.ref(FB.db,'friends/'+MY_UID),async snap=>{const uids=[];snap.forEach(c=>uids.push(c.key));const list=[];for(const uid of uids){try{const s=await FB.get(FB.ref(FB.db,'users/'+uid));if(s.exists())list.push({uid,...s.val()});else list.push({uid,name:'（未知玩家）',level:0,power:0,online:false});}catch(e){}}social.friends=list;if(UI.tab==='social'&&!B)render();});

  const q=FB.query(FB.ref(FB.db,'leaderboard'),FB.orderByChild('power'),FB.limitToLast(50));
  FB.onValue(q,snap=>{social.leaderboard=[];snap.forEach(c=>social.leaderboard.push({uid:c.key,...c.val()}));social.leaderboard.reverse();if(UI.tab==='social'&&!B)render();});

  FB.onValue(FB.ref(FB.db,'guilds'),snap=>{social.allGuilds=[];snap.forEach(c=>social.allGuilds.push({id:c.key,...c.val()}));if(UI.tab==='guild'&&!B)render();});

  listenMyGuild();syncMyProfile();
}

function listenMyGuild(){
  if(social.guildListenerRef && window.FB) { FB.off(social.guildListenerRef); social.guildListenerRef = null; }
  social.myGuildData = null;
  if(!S.guildId || !socialReady())return;
  social.guildListenerRef = FB.ref(FB.db, 'guilds/' + S.guildId);
  FB.onValue(social.guildListenerRef, snap => {
    if(snap.exists()){ social.myGuildData = snap.val(); }
    else { S.guildId = null; social.myGuildData = null; save(); }
    if(UI.tab==='guild'&&!B)render();
  });
}

function waitForFirebase(attempt){
  attempt=attempt||0;
  if(socialReady()){ startSocialListeners(); if(UI.tab==='social'||UI.tab==='guild'){ if(!B) render(); } return; }
  if(attempt>40)return;
  setTimeout(()=>waitForFirebase(attempt+1),500);
}

async function sendFriendRequest(targetUid){
  if(!socialReady()){notify('未连接服务器');return;}

  try{ const s=await FB.get(FB.ref(FB.db,'users/'+targetUid)); if(!s.exists()){notify('该 UID 不存在');return;} await FB.set(FB.ref(FB.db,'friendRequests/'+targetUid+'/'+MY_UID),{name:S.name,at:Date.now()}); notify('好友请求已发送'); }catch(e){notify('发送失败：'+e.message);}
}

async function acceptFriend(fromUid){
  if(!socialReady())return;
  try{ await FB.set(FB.ref(FB.db,'friends/'+MY_UID+'/'+fromUid),true); await FB.set(FB.ref(FB.db,'friends/'+fromUid+'/'+MY_UID),true); await FB.remove(FB.ref(FB.db,'friendRequests/'+MY_UID+'/'+fromUid)); notify('已添加好友'); }catch(e){notify('操作失败');}
}

function chatRoomId(a,b){return [a,b].sort().join('_');}

function openChat(friendUid){
  if(!socialReady())return;
  if(social.chatUnsub){social.chatUnsub();social.chatUnsub=null;}
  social.chatFriend=friendUid; social.chatMessages=[];
  const room=chatRoomId(MY_UID,friendUid);
  const unsub=FB.onValue(FB.ref(FB.db,'chats/'+room),snap=>{ const msgs=[]; snap.forEach(c=>msgs.push(c.val())); msgs.sort((a,b)=>a.at-b.at); social.chatMessages=msgs; if(UI.tab==='social'&&!B)render(); setTimeout(()=>{const el=document.getElementById('chatBox');if(el)el.scrollTop=el.scrollHeight;},50); });

}

async function sendChatMessage(text){
  if(!text||!text.trim()||!social.chatFriend)return;
  const room=chatRoomId(MY_UID,social.chatFriend);
  try{ await FB.push(FB.ref(FB.db,'chats/'+room),{from:MY_UID,text:text.trim(),at:Date.now()}); }catch(e){notify('发送失败');}
}

// ================= 公会系统逻辑 =================
async function createGuild(name){
  if(!socialReady()||!S)return;
  name = name.trim();
  if(name.length<2 || name.length>10) { notify('公会名需在 2-10 字之间'); return; }
  if(S.gold < CREATE_GUILD_COST) { notify('金币不足'); return; }
  const exists = social.allGuilds.some(g => g.name === name);
  if(exists) { notify('该公会名已被占用'); return; }
  try {
    const gid = 'g_' + Date.now().toString(36) + Math.floor(Math.random()*1000);
    const newGuild = { name: name, leaderUid: MY_UID, leaderName: S.name, level: 1, exp: 0, members: { [MY_UID]: { name: S.name, role: '会长', contrib: 0, joinedAt: Date.now() } }, createdAt: Date.now() };
    S.gold -= CREATE_GUILD_COST; await FB.set(FB.ref(FB.db, 'guilds/' + gid), newGuild); S.guildId = gid; save(); listenMyGuild(); render(); notify('成功创建公会：' + name); if(window.syncMyProfile) syncMyProfile();
  } catch(e) { notify('创建失败'); }
}

async function joinGuild(gid){
  if(!socialReady()||!S)return;
  if(S.guildId) { notify('请先退出当前公会'); return; }
  try {
    const snap = await FB.get(FB.ref(FB.db, 'guilds/' + gid));
    if(!snap.exists()) { notify('公会不存在'); return; }
    await FB.update(FB.ref(FB.db, 'guilds/' + gid + '/members/' + MY_UID), { name: S.name, role: '成员', contrib: 0, joinedAt: Date.now() });
    S.guildId = gid; save(); listenMyGuild(); render(); notify('已加入公会');
  } catch(e) { notify('加入失败'); }
}

async function leaveGuild(){
  if(!socialReady()||!S.guildId)return;
  if(!confirm('确定要退出公会吗？贡献和加成将会消失。'))return;
  try {
    const snap = await FB.get(FB.ref(FB.db, 'guilds/' + S.guildId));
    if(snap.exists()) {
      const gd = snap.val(); const members = gd.members || {}; const memberCount = Object.keys(members).length;
      if(gd.leaderUid === MY_UID && memberCount <= 1) { await FB.remove(FB.ref(FB.db, 'guilds/' + S.guildId)); }
      else {
        if(gd.leaderUid === MY_UID) { const nextUid = Object.keys(members).find(u => u !== MY_UID); await FB.update(FB.ref(FB.db, 'guilds/' + S.guildId), { leaderUid: nextUid, leaderName: members[nextUid].name }); await FB.update(FB.ref(FB.db, 'guilds/' + S.guildId + '/members/' + nextUid), { role: '会长' }); }
        await FB.remove(FB.ref(FB.db, 'guilds/' + S.guildId + '/members/' + MY_UID));
      }
    }
    S.guildId = null; social.myGuildData = null; if(social.guildListenerRef) { FB.off(social.guildListenerRef); social.guildListenerRef = null; } save(); render(); notify('已退出公会');
  } catch(e) { notify('退出失败'); }
}

async function donateGuild(amount) {
  if(!socialReady()||!S.guildId||!social.myGuildData)return;
  if(S.gold < amount) { notify('金币不足'); return; }
  try {
    S.gold -= amount; const expGain = amount; let newExp = (social.myGuildData.exp || 0) + expGain; let newLvl = social.myGuildData.level || 1;
    let nextNeed = newLvl * 2000;
    while(newExp >= nextNeed && newLvl < 10) { newExp -= nextNeed; newLvl++; nextNeed = newLvl * 2000; }
    await FB.update(FB.ref(FB.db, 'guilds/' + S.guildId), { exp: newExp, level: newLvl });
    const memberRef = FB.ref(FB.db, `guilds/${S.guildId}/members/${MY_UID}/contrib`);
    const snap = await FB.get(memberRef); const curContrib = snap.val() || 0;
    await FB.set(memberRef, curContrib + amount); save(); render(); notify(`捐献成功！公会获得 ${expGain} 经验`); if(window.syncMyProfile) syncMyProfile();
  } catch(e) { notify('捐献失败'); }
}

    <div class="card"><h3 style="margin-bottom:8px;font-size:14px">成员列表（${memberList.length}人）</h3>${memberList.map(m => `<div class="row"><span class="k">${m.role==='会长'?'👑 ':''}${m.name}</span><span class="v small">贡献：${fmt(m.contrib||0)}</span></div>`).join('')}</div>
    <div class="center" style="margin-top:14px"><button onclick="leaveGuild()" style="background:#3a1a1a;color:#e88a7a;border-color:#5a2a2a">退出公会</button></div>`;
  }
  const shopTab = UI.guildTab || 'list';
  return `<div class="tabs" style="margin-bottom:12px"><button class="${shopTab==='list'?'active':''}" data-act="guildTab" data-arg="list">全服公会</button><button class="${shopTab==='create'?'active':''}" data-act="guildTab" data-arg="create">创建公会</button></div>
  ${shopTab==='create' ? `<div class="card"><h3 style="margin-bottom:8px">创建公会</h3><p class="small" style="margin-bottom:12px">消耗 <span class="hl">${fmt(CREATE_GUILD_COST)} CC</span> 建立属于你的公会。你将成为会长。</p><input id="guildNameInput" placeholder="输入公会名称（2-10字）" maxlength="10" style="margin-bottom:8px"><button onclick="createGuild(document.getElementById('guildNameInput').value)" style="width:100%;padding:12px" ${S.gold<CREATE_GUILD_COST?'disabled':''}>创建公会</button></div>` : `<div class="card"><h3 style="margin-bottom:8px">全服公会列表</h3>${social.allGuilds.length ? social.allGuilds.map(g => `<div class="item" style="padding:10px"><span class="iname"><span class="hl" style="font-size:15px">${g.name}</span> <span class="small">Lv.${g.level||1}</span><br><span class="small">会长：${g.leaderName} · 成员：${Object.keys(g.members||{}).length}人</span></span><button onclick="joinGuild('${g.id}')" style="padding:6px 12px">申请加入</button></div>`).join('') : '<div class="small">目前还没有人创建公会，你可以去建一个！</div>'}</div>`}`;
}

function renderShop(p){
  if(!S.potions)S.potions={hp:0,hpBig:0,mp:0,ultimate:0};if(!S.skillbooks)S.skillbooks=[];if(!S.weaponStock)S.weaponStock=[];
  const shopTab=UI.shopTab||'potion'; let body='';
  if(shopTab==='potion'){body=`<div class="small" style="margin-bottom:8px">战斗中可使用的消耗品（当前持有数量）</div>${Object.entries(POTIONS).map(([k,po])=>`<div class="item" style="padding:10px"><span style="font-size:20px">${po.icon}</span><span class="iname"><span style="color:var(--gold2)">${po.n}</span> <span class="small">持有 ×${S.potions[k]||0}</span><br><span class="small">${po.d}</span></span><span class="hl" style="margin-right:8px">${fmt(po.price)}</span><button data-act="buyPotion" data-arg="${k}" ${S.gold<po.price?'disabled':''} style="padding:6px 12px">购买</button></div>`).join('')}`;}
  else if(shopTab==='book'){body=`<div class="small" style="margin-bottom:8px">当前职业「${CLASSES[S.cls].name}」的专属技能书。每本只能买一次。</div>${(SKILLBOOKS[S.cls]||[]).map(b=>{const owned=S.skillbooks.includes(b.id);return `<div class="item" style="padding:10px"><span style="font-size:20px">📕</span><span class="iname"><span style="color:var(--gold2)">${b.n}</span>${owned?' <span style="color:#7fd4a0">✓ 已学</span>':''}<br><span class="small">${b.d}${b.mp?'（'+b.mp+'斗气）':''}</span></span><span class="hl" style="margin-right:8px">${fmt(b.price)}</span><button data-act="buyBook" data-arg="${b.id}" ${owned||S.gold<b.price?'disabled':''} style="padding:6px 12px">${owned?'已拥有':'购买'}</button></div>`;}).join('')}`;}
  else if(shopTab==='gacha'){body=`<div class="card" style="background:#0f0c09;border-color:#a855f7"><div style="font-size:22px;text-align:center">🎁</div><div class="center" style="color:#a855f7;font-weight:bold;margin:6px 0">精炼石 · 装备盲盒</div><p class="small center">随机开出一件<b>史诗 ~ 神话</b>品质的装备（不分部位，无职业限制）。<br>价格：<span class="hl">${fmt(GACHA_PRICE)} CC</span></p><div class="center" style="margin-top:10px"><button data-act="buyGacha" ${S.gold<GACHA_PRICE?'disabled':''} style="padding:12px 30px">开启盲盒</button></div></div>`;}
  else {ensureWeaponStock();body=`<div class="item" style="padding:10px;background:#0f0c09;border-color:#c8a050"><span style="font-size:20px">🏪</span><span class="iname"><span style="color:var(--gold2)">流浪武器商</span><br><span class="small">每次刷新随机出现 4~5 件武器，品质与职业限制随机。刷新费用 <span class="hl">${fmt(WEAPON_REFRESH_COST)} CC</span>。</span></span><button data-act="refreshWeaponShop" ${S.gold<WEAPON_REFRESH_COST?'disabled':''} style="padding:8px 12px">🔄 刷新</button></div>${S.weaponStock.length?S.weaponStock.map((it,i)=>{const ok=canEquip(it);return `<div class="item" style="padding:10px;flex-wrap:wrap"><span style="font-size:20px">⚔️</span><span class="iname" style="flex:1 1 200px"><span class="rar${it.rar}">${it.name}</span><span class="small"> Lv.${it.lvl} · ${RAR[it.rar].n}</span><span class="small ${ok?'ok':'danger'}">（${reqLabel(it)}${ok?'':' · 你无法装备'}）</span><br><span class="small">${STAT_KEYS.filter(k=>it[k]).map(k=>STAT_LABELS[k]+'+'+it[k]).join('　')}</span></span><span class="hl" style="margin-right:8px">${fmt(it.shopPrice)}</span><button data-act="buyWeapon" data-arg="${i}" ${S.gold<it.shopPrice?'disabled':''} style="padding:6px 12px">购买</button></div>`;}).join(''):'<div class="small">商人的货架空了，刷新一下吧。</div>'}`;}
  return `<h3 style="margin-bottom:10px">🏪 商店</h3><p class="small" style="margin-bottom:10px">持有：<span class="hl">${fmt(S.gold)} CC</span></p><div class="tabs" style="margin-bottom:12px"><button class="${shopTab==='potion'?'active':''}" data-act="shopTab" data-arg="potion">药水</button><button class="${shopTab==='book'?'active':''}" data-act="shopTab" data-arg="book">技能书</button><button class="${shopTab==='gacha'?'active':''}" data-act="shopTab" data-arg="gacha">盲盒</button><button class="${shopTab==='weapon'?'active':''}" data-act="shopTab" data-arg="weapon">武器店</button></div>${body}`;
}

function renderSocial(){
  if(!socialReady()){return `<div class="card center"><div class="small">正在连接服务器…</div></div>`;}
  const myPower=calcPower();const onlineCount=social.friends.filter(f=>f.online).length;const chatFriendData=social.chatFriend?social.friends.find(f=>f.uid===social.chatFriend):null;
  return `
  <div class="card">
    <div class="row"><span class="k">我的名字</span><span class="v">${S.name}</span></div>
    <div class="row"><span class="k">等级 / 战力</span><span class="v">Lv.${S.level} · ${fmt(myPower)}</span></div>
    <div class="row"><span class="k">账号状态</span><span class="v">${window.MY_IS_ANON?'游客（未绑定邮箱）':window.MY_EMAIL}</span></div>
    <div style="margin-top:8px"><div class="small" style="margin-bottom:4px">我的 UID（发给朋友添加你）</div><div style="display:flex;gap:6px"><input id="myUidBox" value="${MY_UID}" readonly style="font-size:11px;font-family:monospace"><button onclick="navigator.clipboard.writeText('${MY_UID}');notify('已复制 UID')" style="padding:8px 12px;white-space:nowrap">复制</button></div></div>
  </div>
  <div class="card"><h3 style="margin-bottom:8px">添加好友</h3><div style="display:flex;gap:6px"><input id="friendUidInput" placeholder="粘贴对方 UID…" style="font-size:12px"><button onclick="sendFriendRequest(document.getElementById('friendUidInput').value.trim())" style="padding:8px 12px;white-space:nowrap">发送请求</button></div></div>
  ${social.requests.length?`<div class="card"><h3 style="margin-bottom:8px">待处理请求（${social.requests.length}）</h3>${social.requests.map(r=>`<div class="item"><span class="iname"><span class="hl">${r.name||r.uid.slice(0,8)}</span> <span class="small">请求加你为好友</span></span><button onclick="acceptFriend('${r.uid}')" style="padding:4px 10px;font-size:11px">接受</button></div>`).join('')}</div>`:''}
  <div class="card"><h3 style="margin-bottom:8px">好友列表（${social.friends.length}）</h3>${social.friends.length?social.friends.map(f=>`<div class="item"><span class="dot" style="background:${f.online?'#4a7c59':'#5a3a3a'}"></span><span class="iname"><span class="hl">${f.name}</span><span class="small">Lv.${f.level} · 战力 ${fmt(f.power||0)} · ${f.adv||''}</span></span><button onclick="openChat('${f.uid}')" style="padding:4px 10px;font-size:11px">聊天</button></div>`).join(''):'<div class="small">还没有好友，把你的 UID 发给朋友吧。</div>'}</div>
  ${social.chatFriend?`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><h3>💬 ${chatFriendData?chatFriendData.name:'好友'}</h3><button onclick="social.chatFriend=null;social.chatMessages=[];if(social.chatUnsub){social.chatUnsub();social.chatUnsub=null;}render()" style="padding:4px 10px;font-size:11px">关闭</button></div><div id="chatBox" class="chat-box">${social.chatMessages.length?social.chatMessages.map(m=>`<div class="chat-msg ${m.from===MY_UID?'me':'other'}"><span class="chat-bubble">${escapeHtml(m.text)}</span></div>`).join(''):'<div class="small">还没有消息</div>'}</div><div style="display:flex;gap:6px"><input id="chatInput" placeholder="输入消息…" style="font-size:12px" onkeydown="if(event.key==='Enter'){sendChatMessage(this.value);this.value=''}"><button onclick="const i=document.getElementById('chatInput');sendChatMessage(i.value);i.value=''" style="padding:8px 12px;white-space:nowrap">发送</button></div></div>`:''}
  <div class="card"><h3 style="margin-bottom:8px">🏆 全服排行榜 Top 50</h3>${social.leaderboard.length?social.leaderboard.map((u,i)=>{const isMe=u.uid===MY_UID;return `<div class="row"><span class="k" style="${i<3?'color:#ffd700':''}">${i+1}. ${isMe?'<span class="hl">'+escapeHtml(u.name)+'（你）</span>':escapeHtml(u.name)}</span><span class="v small">Lv.${u.level} · 战力 ${fmt(u.power||0)}</span></div>`;}).join(''):'<div class="small">暂无数据</div>'}</div>`;
}

function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function statusBar(){
  if(!B||!B.status)return '';const s=B.status;let html='';
  if(s.bleed>0)html+='<span class="status-tag status-bleed">🩸 流血 '+s.bleed+'</span>';
  if(s.burn>0)html+='<span class="status-tag status-burn">🔥 灼烧 '+s.burn+'</span>';
  if(s.freeze>0)html+='<span class="status-tag status-freeze">❄️ 冰冻 '+s.freeze+'</span>';
  if(s.stun>0)html+='<span class="status-tag status-stun">💫 眩晕 '+s.stun+'</span>';
  return html?'<div class="status-bar">'+html+'</div>':'';
}

function renderBattle(){
  const p=playerStats();const e=B.enemy;const skills=getSkills();const canAct=!(B.status.freeze>0||B.status.stun>0)&&!B.busy&&!B.over;
  return `
  <div class="topbar"><span class="pname">${S.name}</span><span class="tag">Lv.${S.level}</span><span class="tag">${CLASSES[S.cls].icon} ${S.adv||CLASSES[S.cls].name}</span></div>
  <div class="card" style="padding:10px 14px;margin-bottom:10px">${bar(S.hp,p.hp,'hpfill')}${bar(S.mp,p.mp,'mpfill')}${statusBar()}</div>
  <div class="enemy-box"><span class="enemy-ic">${e.isBoss?'🐲':'👹'}</span><div class="enemy-name">${e.name} ${e.isBoss?'<span class="tag" style="border-color:#c0392b;color:#e88a7a">BOSS</span>':''}</div><div class="small">Lv.${e.lv}${e.isBoss?'　下一技能：'+[3,6,9,12].find(n=>n>B.bossTurn)+'回合后':''}</div>${bar(e.hp,e.maxHp,'hpfill')}</div>
  <div class="card"><div class="log" id="battleLog">${B.log.slice(-40).map(l=>`<div class="${l.t}">${l.m}</div>`).join('')}</div></div>
  ${B.over?`<div class="card center">${B.reward.exp?`<div class="hl" style="font-size:15px">战斗胜利</div><div class="small">经验 +${fmt(B.reward.exp)}　金币 +${fmt(B.reward.gold)}</div>${B.reward.items.length?`<div class="small">战利品：${B.reward.items.map(i=>`<span class="rar${i.rar}">${i.name}</span>`).join('、')}</div>`:''}${B.reward.shards?`<div class="small hl">圣冠碎片 +1</div>`:''}`:`<div class="danger" style="font-size:15px">战斗结束</div>`}<div class="flex" style="margin-top:12px"><button data-act="endBattle" style="padding:12px">返 回</button></div></div>`:`<div style="margin-bottom:8px">${skills.map((s,i)=>`<button class="skill-btn" data-act="skill" data-arg="${i}" ${!canAct||s.mp>S.mp?'disabled':''}><span>${s.n}</span><small>${s.mp?s.mp+' 斗气':'无消耗'}　${s.d}</small></button>`).join('')}<div style="border-top:1px dashed var(--line);padding-top:8px;margin-top:4px"><div class="small" style="margin-bottom:4px">药水</div><div style="display:flex;gap:4px;flex-wrap:wrap">${Object.entries(POTIONS).map(([k,po])=>{const qty=(S.potions&&S.potions[k])||0;return `<button class="potion-btn" data-act="potion" data-arg="${k}" ${!canAct||qty<=0?'disabled':''}>${po.icon} ${po.n}×${qty}</button>`;}).join('')}</div></div><button class="skill-btn" data-act="flee" ${!canAct?'disabled':''} style="margin-top:8px"><span>🏃 逃跑</span><small>速度越高成功率越高</small></button></div>`}`;
}

function render(){
  const root=document.getElementById('root');let html='';
  if(!S)html=renderTitle();else if(B)html=renderBattle();else html=renderMain();
  if(UI.showAuthModal)html+=renderAuthModal();
  html+=`<div id="notif" class="notif" style="display:${UI.notif?'block':'none'}">${UI.notif||''}</div>`;
  root.innerHTML=html;
  const log=document.getElementById('battleLog');if(log)log.scrollTop=log.scrollHeight;
  const chatBox=document.getElementById('chatBox');if(chatBox)chatBox.scrollTop=chatBox.scrollHeight;
}

document.getElementById('root').addEventListener('click',async ev=>{
  const btn=ev.target.closest('[data-act]');if(!btn)return;
  const act=btn.dataset.act;const arg=btn.dataset.arg;
  switch(act){
    case 'newgame':UI.creating=true;S=null;renderCreateScreen();break;
    case 'loadgame':if(load()){syncVitals();render();notify('存档已读取');if(socialReady()){syncMyProfile();listenMyGuild();}}else notify('无存档');break;
    case 'origin':UI.originSel=arg;renderCreateScreen();break;
    case 'class':UI.classSel=arg;renderCreateScreen();break;
    case 'back':S=null;render();break;
    case 'begin':beginGame();break;
    case 'tab':UI.tab=arg;if(arg==='social'&&socialReady())syncMyProfile();render();break;
    case 'region':UI.region=parseInt(arg);render();break;
    case 'explore':explore();break;
    case 'mode':S.mode=S.mode==='online'?'single':'online';if(S.mode==='single'&&UI.tab==='guild')UI.tab='explore';save();render();notify(S.mode==='online'?'联网模式':'单机模式（经验+20%）');break;
    case 'equip':equipItem(parseInt(arg));break;
    case 'sell':sellItem(parseInt(arg));break;
    case 'unequip':if(S.equip[arg]){S.inv.push(S.equip[arg]);S.equip[arg]=null;syncVitals();save();render();if(socialReady())syncMyProfile();}break;
    case 'adv':S.adv=arg;S.hp=playerStats().hp;S.mp=playerStats().mp;save();render();if(socialReady())syncMyProfile();notify('进阶：'+arg);break;
    case 'sub':S.sub=arg;save();render();if(socialReady())syncMyProfile();notify('副职业：'+CLASSES[arg].name);break;
    case 'dungeon':enterDungeon(parseInt(arg));break;
    case 'skill':await useSkill(parseInt(arg));break;
    case 'potion':usePotion(arg);break;
    case 'flee':flee();break;
    case 'endBattle':B=null;render();break;
    case 'crownAwaken':{if((S.shards||0)<5||S.crown)return;S.shards-=5;const c=pick(CROWNS);S.crown={name:c.name,days:30};S.hp=playerStats().hp;S.mp=playerStats().mp;save();render();if(socialReady())syncMyProfile();notify('👑 觉醒：'+c.name);break;}
    case 'shopTab':UI.shopTab=arg;if(arg==='weapon')ensureWeaponStock();render();break;
    case 'guildTab':UI.guildTab=arg;render();break;
    case 'donateGuild':donateGuild(parseInt(arg));break;
    case 'buyPotion':{const po=POTIONS[arg];if(!po||S.gold<po.price)return;S.gold-=po.price;if(!S.potions)S.potions={hp:0,hpBig:0,mp:0,ultimate:0};S.potions[arg]=(S.potions[arg]||0)+1;save();render();notify('购买 '+po.n);break;}
    case 'buyBook':{const bk=(SKILLBOOKS[S.cls]||[]).find(b=>b.id===arg);if(!bk||S.skillbooks.includes(arg)||S.gold<bk.price)return;S.gold-=bk.price;S.skillbooks.push(arg);save();render();notify('学会技能书：'+bk.n);break;}
    case 'buyGacha':{if(S.gold<GACHA_PRICE){notify('金币不足');return;}if(S.inv.length>=40){notify('背包已满');return;}S.gold-=GACHA_PRICE;const rar=rnd(4,7);const lv=Math.max(S.level,10);const it=genEquip(pick(SLOTS).id,lv,rar);S.inv.push(it);save();render();notify('🎁 开出：'+it.name);break;}
    case 'refreshWeaponShop':{if(S.gold<WEAPON_REFRESH_COST){notify('金币不足');return;}S.gold-=WEAPON_REFRESH_COST;refreshWeaponStock();save();render();notify('武器已刷新');break;}
    case 'buyWeapon':{const idx=parseInt(arg);if(!S.weaponStock)return;const it=S.weaponStock[idx];if(!it)return;if(S.gold<it.shopPrice){notify('金币不足');return;}if(S.inv.length>=40){notify('背包已满');return;}S.gold-=it.shopPrice;const copy=JSON.parse(JSON.stringify(it));delete copy.shopPrice;S.inv.push(copy);S.weaponStock.splice(idx,1);save();render();notify('购买 '+copy.name);break;}
    case 'showAuth':UI.showAuthModal=true;UI.authMode='login';render();break;
    case 'logout':logout();break;
    case 'reset':if(confirm('删除本地存档重新开始？（如果是正式账号，云存档依然存在）')){try{localStorage.removeItem('holycrown_save');}catch(e){}S=null;B=null;UI.creating=true;UI.classSel=null;render();}break;
  }
});

function renderCreateScreen(){
  const root=document.getElementById('root');root.innerHTML=renderCreate();
  const inp=document.getElementById('nameInput');if(inp){inp.addEventListener('input',e=>{UI.name=e.target.value;});inp.focus();}
}

function beginGame(){
  const inp=document.getElementById('nameInput');if(inp)UI.name=inp.value.trim();
  if(!UI.classSel){notify('请选择职业');return;}
  if(!UI.name){notify('请输入角色名');return;}
  S={name:UI.name,origin:UI.originSel,cls:UI.classSel,level:1,exp:0,hp:0,mp:0,gold:500,shards:0,inv:[],equip:{weapon:null,helmet:null,armor:null,boots:null,bracer:null,bracelet:null,ring:null,necklace:null},adv:null,sub:null,crown:null,titles:[],guildId:null,mode:'online',day:1,kills:0,deaths:0,skillbooks:[],potions:{hp:2,hpBig:0,mp:1,ultimate:0},weaponStock:[]};
  const p=playerStats();S.hp=p.hp;S.mp=p.mp;
  const starter=genEquip('weapon',1,1);starter.name='新手·'+starter.name;S.equip.weapon=starter;
  B=null;UI.tab='explore';save();render();notify('欢迎来到阿斯米德约顿');
  if(socialReady()){syncMyProfile();listenMyGuild();}
}

(function init(){
  if(load()){syncVitals();render();}
  else{render();}
  setTimeout(()=>waitForFirebase(0),800);
})();
</script>
